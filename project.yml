name: ESPatcher
options:
  bundleIdPrefix: net.matheusound
  deploymentTarget:
    macOS: '15.0'
    iOS: '26.0'
settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_OBJC_BRIDGING_HEADER: Apple/Shared/Bridge.h
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 11
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_IDENTITY: '-'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
targets:
  ESPatcherMac:
    type: application
    platform: macOS
    sources:
      - path: Apple/App
      - path: Apple/Shared
      - path: Core
      - path: Firmware/Modules
        type: folder
        buildPhase: resources
      - path: Vendor/wasm3/LICENSE
        buildPhase: resources
      - path: Vendor/wasm3/gs_sandbox.c
        compilerFlags: ['-O3', '-DNASSERTS', '-UDEBUG']
      - path: Vendor/wasm3/m3_bind.c
        compilerFlags: ['-O3', '-DNASSERTS', '-UDEBUG', '-fomit-frame-pointer', '-Wno-shorten-64-to-32', '-Wno-unused-variable', '-Wno-strict-prototypes']
      - path: Vendor/wasm3/m3_code.c
        compilerFlags: ['-O3', '-DNASSERTS', '-UDEBUG', '-fomit-frame-pointer', '-Wno-shorten-64-to-32', '-Wno-unused-variable', '-Wno-strict-prototypes']
      - path: Vendor/wasm3/m3_compile.c
        compilerFlags: ['-O3', '-DNASSERTS', '-UDEBUG', '-fomit-frame-pointer', '-Wno-shorten-64-to-32', '-Wno-unused-variable', '-Wno-strict-prototypes']
      - path: Vendor/wasm3/m3_core.c
        compilerFlags: ['-O3', '-DNASSERTS', '-UDEBUG', '-fomit-frame-pointer', '-Wno-shorten-64-to-32', '-Wno-unused-variable', '-Wno-strict-prototypes']
