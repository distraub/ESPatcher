        PRODUCT_BUNDLE_IDENTIFIER: net.matheusound.glitchsynthm5
        PRODUCT_NAME: ESPatcher
        INFOPLIST_KEY_CFBundleDisplayName: ESPatcher
        INFOPLIST_KEY_CFBundleName: ESPatcher
