; Experimental RAM-loaded WASM target. Builds the resident ESPatcher launcher.
[platformio]
default_envs = sd_prototype

[env:sd_prototype]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:wasm3.py
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = ../partitions.csv
board_build.f_cpu = 240000000L
monitor_speed = 115200
build_unflags =
    -std=gnu++11
    -fno-exceptions
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    -std=gnu++17
    -fexceptions
    -DNASSERTS
    -UDEBUG
    -DARDUINO_RUNNING_CORE=0
    -DARDUINO_EVENT_RUNNING_CORE=0
    -DARDUINO_LOOP_STACK_SIZE=24576
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    https://github.com/m5stack/M5Cardputer.git#bf64d3178ab43928fa02365fbe3937cec99716ad
    https://github.com/m5stack/M5Unified.git#96576a14247ddc935149145aa6b51943464120f1
    https://github.com/m5stack/M5GFX.git#28d47949bdc84f30881623476f555398e2194313
lib_ignore = IRremote
