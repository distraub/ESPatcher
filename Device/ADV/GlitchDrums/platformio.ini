; Full-feature native port experiment. Never flashed automatically.
[platformio]
default_envs = glitchdrums_cpu

[env:glitchdrums_full]
build_src_filter = +<*> -<probe.cpp> -<voice_probe.c>
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = ../partitions.csv
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 460800
build_unflags =
    -std=gnu++11
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    -std=gnu++17
    -DGD_PORT_NATIVE=1
    -DFOMA_MVAVE=1
    -DFOMA_USB_AUDIO=0
    -DFOMA_MIDI_CLOCK=0
    -DFOMA_BLUETOOTH=0
    -I../../../Instruments/GlitchDrums/upstream/platform
    -I../../../Instruments/GlitchDrums/upstream/platform/src
    -I../../../Instruments/GlitchDrums/upstream/platform/gen
    -DARDUINO_RUNNING_CORE=0
    -DARDUINO_EVENT_RUNNING_CORE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    https://github.com/m5stack/M5Cardputer.git#bf64d3178ab43928fa02365fbe3937cec99716ad
    https://github.com/m5stack/M5Unified.git#96576a14247ddc935149145aa6b51943464120f1
    https://github.com/m5stack/M5GFX.git#28d47949bdc84f30881623476f555398e2194313
lib_ignore = IRremote

; Voice-only measurement image: all eight voice engines, no effects/UI/I2S.
[env:glitchdrums_cpu]
extends = env:glitchdrums_full
build_src_filter = +<voice_probe.c> +<probe.cpp>
lib_deps =
lib_ignore = M5Cardputer, M5Unified, M5GFX, IRremote
build_flags =
    ${env:glitchdrums_full.build_flags}
    -DGD_CPU_PROBE=1
    -DGD_PORT_PROFILE=1
